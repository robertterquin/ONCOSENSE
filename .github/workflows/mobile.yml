name: Mobile (React Native)

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'supabase/**'
      - '**.md'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so modules that read the config can load; tests don't call Supabase.
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
