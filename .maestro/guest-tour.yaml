# Guest tour: no account needed and nothing is written to Supabase.
# Welcome → Today → Learn → guided self-check → Help → Community → Settings.
appId: com.oncosense.app
---
- launchApp:
    clearState: true
- tapOn: 'Look around without an account'
- assertVisible: 'Hello.*'

# Learn → a guided self-check, step by step
- tapOn: 'Learn'
- assertVisible: 'Check yourself'
- tapOn: 'Skin Cancer ABCDE Check.*'
- repeat:
    while:
      notVisible: 'Mark as done'
    commands:
      - tapOn: 'Next step'
- tapOn: 'Mark as done'
- assertVisible: 'Done'
- tapOn: 'Back to Learn'

# Help and Community
- tapOn: 'Help'
- assertVisible: 'Get help'
- tapOn: 'Community'
- assertVisible: 'Ask a question'

# Profile → Settings → theme
- tapOn: 'Today'
- tapOn: 'Profile and settings'
- tapOn: 'Settings'
- tapOn: 'Dark'
- tapOn: 'Phone'
