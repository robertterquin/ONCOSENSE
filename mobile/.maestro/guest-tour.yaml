# Guest tour: no account needed and nothing is written to Supabase.
# Welcome → login → Continue as Guest → every tab → notification center → settings.
appId: com.oncosense.app
---
- launchApp:
    clearState: true
- tapOn: 'I already have an account'
- tapOn: 'Continue as Guest'
- assertVisible: 'Hello, Guest.*'

# Notification center (sample notifications on first use)
- tapOn: 'Notifications.*'
- assertVisible: 'Daily Health Tip'
- tapOn: 'Mark all as read'
- assertVisible: 'All caught up!'
- tapOn: 'Go back'

# Tabs
- tapOn: 'Info'
- assertVisible: 'Cancer Information'
- tapOn: 'Prevention'
- assertVisible: 'Prevention.*'
- tapOn: 'Forum'
- assertVisible: 'Q&A Forum'
- tapOn: 'Resources'
- assertVisible: 'Resources.*'
- tapOn: 'Journey'
- assertVisible: 'Track your journey'
- tapOn: 'Home'

# Profile → Settings
- tapOn: 'Profile'
- tapOn: 'Settings'
- assertVisible: 'Push Notifications'
- tapOn: 'Dark Mode'
- tapOn: 'Dark Mode'
